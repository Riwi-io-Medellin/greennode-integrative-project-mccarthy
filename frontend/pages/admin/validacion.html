<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GreenNode | Validación Humana</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="../../styles/dashboard.css" />
</head>
<body>
<aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
        <div class="sidebar-brand-icon"><i class="bi bi-tree"></i></div>
        <span class="sidebar-brand-name">GreenNode</span>
    </div>
    <ul class="sidebar-nav">
        <li><a href="/admin/dashboard"><i class="bi bi-grid"></i><span class="nav-label">Dashboard</span></a></li>
        <li><a href="/admin/cotizaciones"><i class="bi bi-file-text"></i><span class="nav-label">Cotizaciones</span></a></li>
        <li class="active"><a href="/admin/validacion"><i class="bi bi-shield-check"></i><span class="nav-label">Validación Humana</span></a></li>
        <li><a href="/admin/proyectos"><i class="bi bi-folder"></i><span class="nav-label">Proyectos</span></a></li>
        <li><a href="/admin/archivos"><i class="bi bi-archive"></i><span class="nav-label">Archivos</span></a></li>
    </ul>
    <div class="sidebar-footer">
        <button class="btn-logout-sidebar" onclick="logout()">
            <i class="bi bi-box-arrow-right"></i>
            <span class="logout-label">Cerrar sesión</span>
        </button>
        <button class="collapse-btn" id="collapseBtn">
            <i class="bi bi-chevron-left"></i>
            <span class="collapse-text">Colapsar</span>
        </button>
    </div>
</aside>

<div class="main-wrapper" id="mainWrapper">
    <div class="topbar">
        <div class="topbar-company">
            <div class="company-avatar">AD</div>
            <span id="adminName">Administrador</span>
        </div>
        <div class="topbar-actions">
            <button class="btn-logout-topbar" onclick="logout()">
                <i class="bi bi-box-arrow-right"></i> Salir
            </button>
        </div>
    </div>

    <!-- LISTADO -->
    <div class="content" id="listView">
        <div class="page-title">Validación Humana</div>
        <div class="page-subtitle" id="validSubtitle">Marcos lógicos pendientes de revisión</div>
        <div id="validationList" style="margin-top:1.5rem">
            <div class="empty-state"><i class="bi bi-hourglass"></i>Cargando...</div>
        </div>
    </div>

    <!-- DETALLE -->
    <div class="content" id="detailView" style="display:none">
        <div class="detail-header">
            <a href="#" class="btn-back" onclick="showList(); return false;"><i class="bi bi-arrow-left"></i></a>
            <div>
                <div class="text-muted" style="font-size:0.82rem" id="detailCode">GN-0000</div>
                <div class="d-flex align-items-center gap-3">
                    <h2 class="mb-0" style="font-size:1.4rem;font-weight:700" id="detailTitle">—</h2>
                    <span class="badge-status badge-pending" id="detailBadge">Pendiente</span>
                </div>
            </div>
        </div>

        <div class="dual-panel">
            <div class="panel-box panel-ai">
                <div class="mb-3">
                    <span class="ai-badge"><i class="bi bi-stars"></i> Borrador IA (original)</span>
                </div>
                <div id="aiDraftText" style="font-size:0.85rem;white-space:pre-wrap;line-height:1.7;color:var(--gn-text);max-height:500px;overflow-y:auto">—</div>
            </div>
            <div class="panel-box panel-validated">
                <div class="mb-3 fw-bold d-flex align-items-center gap-2" style="color:#065f46">
                    <i class="bi bi-check-circle-fill text-success"></i> Versión validada por el administrador
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Texto del Marco Lógico <span class="text-danger">*</span></label>
                    <textarea class="form-control" id="validatedText" rows="9" placeholder="Edita el borrador de IA aquí..."></textarea>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Monto final aprobado (COP)</label>
                    <input type="number" class="form-control" id="validatedAmount" placeholder="Ej: 620000000" />
                    <div id="amountHint" class="text-muted mt-1" style="font-size:0.76rem"></div>
                </div>
                <div class="d-flex gap-2 mt-3">
                    <button class="btn-primary-gn flex-grow-1 justify-content-center" onclick="saveValidation()">
                        <i class="bi bi-save"></i> Guardar como revisado
                    </button>
                    <button class="btn-outline-gn flex-grow-1 justify-content-center" onclick="sendToClient()" style="background:#059669;color:#fff;border-color:#059669">
                        <i class="bi bi-send"></i> Guardar y enviar
                    </button>
                </div>
                <button class="btn-outline-gn w-100 justify-content-center mt-2" onclick="rejectQuote()" style="color:#ef4444;border-color:#ef4444">
                    <i class="bi bi-x-circle"></i> Rechazar cotización
                </button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script type="module" src="/js/admin/validacion.js"></script>
</body>
</html>
