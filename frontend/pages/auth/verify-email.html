<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GreenNode | Verificar Email</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../../styles/auth.css" />
  <link rel="stylesheet" href="/pages/auth/verify-email.css" />
</head>
<body class="auth-page">
<main class="container py-4">
  <div class="row min-vh-100 align-items-center justify-content-center">
    <div class="col-12 col-md-8 col-lg-5">
      <div class="bg-white rounded-4 shadow-lg overflow-hidden">

        <!-- Cabecera verde -->
        <div class="verify-card-header">
          <div class="verify-card-icon">🌿</div>
          <div class="text-white fw-bold" style="font-size:1.5rem;letter-spacing:0.3px;">GreenNode</div>
          <div class="text-white-50 mt-1" style="font-size:0.88rem;">Verifica tu cuenta para continuar</div>
        </div>

        <!-- Cuerpo -->
        <div class="verify-card-body">
          <div id="globalAlert" class="alert d-none" role="alert"></div>

          <h2 class="fw-bold mb-1" style="font-size:1.25rem;">Revisa tu correo</h2>
          <p class="text-muted mb-0" style="font-size:0.9rem;">
            Enviamos un código de 6 dígitos a:
          </p>
          <div class="email-chip" id="emailDisplay">—</div>

          <!-- Inputs OTP -->
          <div class="otp-group" id="otpGroup">
            <input class="otp-input" type="text" inputmode="numeric" maxlength="1" />
            <input class="otp-input" type="text" inputmode="numeric" maxlength="1" />
            <input class="otp-input" type="text" inputmode="numeric" maxlength="1" />
            <input class="otp-input" type="text" inputmode="numeric" maxlength="1" />
            <input class="otp-input" type="text" inputmode="numeric" maxlength="1" />
            <input class="otp-input" type="text" inputmode="numeric" maxlength="1" />
          </div>

          <button id="btnVerify" class="btn btn-success w-100 auth-btn mb-3" disabled>
            <span id="verifyText">Verificar cuenta</span>
            <span id="verifyLoading" class="d-none">
              <span class="spinner-border spinner-border-sm me-2"></span>Verificando...
            </span>
          </button>

          <div class="text-center">
            <p class="text-muted mb-1" style="font-size:0.85rem;">¿No recibiste el código?</p>
            <button id="resendBtn" class="btn btn-link text-decoration-none fw-semibold p-0 auth-link" style="font-size:0.88rem;" disabled>
              Reenviar código <span id="resendTimer"></span>
            </button>
          </div>

          <div class="text-center mt-3">
            <a href="/login" class="text-muted" style="font-size:0.82rem;">← Volver al inicio de sesión</a>
          </div>
        </div>

      </div>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="/js/auth/verify-email.js"></script>
</body>
</html>
